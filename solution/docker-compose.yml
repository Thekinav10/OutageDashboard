services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"

  gateway-service:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >-
      sh -c "pip install --no-cache-dir fastapi httpx uvicorn
      opentelemetry-distro opentelemetry-exporter-otlp-proto-http
      opentelemetry-instrumentation-fastapi opentelemetry-instrumentation-httpx
      && opentelemetry-instrument uvicorn gateway:app --host 0.0.0.0 --port 5000"
    environment:
      OTEL_SERVICE_NAME: gateway-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "5000:5000"
    depends_on:
      - jaeger
      - payment-service

  payment-service:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >-
      sh -c "pip install --no-cache-dir fastapi uvicorn
      opentelemetry-distro opentelemetry-exporter-otlp-proto-http
      opentelemetry-instrumentation-fastapi
      && opentelemetry-instrument uvicorn payment:app --host 0.0.0.0 --port 5001"
    environment:
      OTEL_SERVICE_NAME: payment-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PAYMENT_FAIL_RATE: "${PAYMENT_FAIL_RATE:-0}"
    ports:
      - "5001:5001"
    depends_on:
      - jaeger